# Exact-session verifier: RAW bypass + per-AudioTrack ViPER validation
name: Build V4ATune Kotlin APK

concurrency:
  group: v4atune-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "v4atune-kotlin" ]
    paths:
      - "v4atune/**"
      - ".github/workflows/v4atune-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v4atune

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Test, lint and build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon --build-cache

      - name: APK sanity checks
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | head -n 20
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: V4ATune-0.3.6-alpha01-kotlin
          path: v4atune/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
