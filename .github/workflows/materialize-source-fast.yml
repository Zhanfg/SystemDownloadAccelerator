name: Materialize Alpha 12 source fast

on:
  push:
    branches:
      - restore/materialize-alpha12-fast

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install source-migration SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Remove historical intermediate builds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for path in sorted(Path('ci').glob('build-alpha*.sh')):
              if path.name in {'build-alpha12-fixed.sh', 'build-alpha12-integrated-module.sh'}:
                  continue
              text = path.read_text(encoding='utf-8')
              markers = [
                  '\nrm -rf app/build dist',
                  '\ngradle --no-daemon',
              ]
              positions = [text.find(marker) for marker in markers if text.find(marker) >= 0]
              if not positions:
                  continue
              text = text[:min(positions)].rstrip() + '\n'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Expand Alpha 12 source
        shell: bash
        run: |
          chmod +x ci/build-alpha12-fixed.sh
          ci/build-alpha12-fixed.sh
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/io/github/zhanfg/sda/FirstRunSetupActivity.java
          grep -q 'versionName = "0.3.0-alpha12"' app/build.gradle.kts
          grep -q 'com.android.providers.downloads' app/src/main/resources/META-INF/xposed/scope.list

      - name: Commit normal source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap app/build dist .gradle
          find . -maxdepth 1 -type f -name '.ci-*' -delete
          rm -f .github/workflows/materialize-source-fast.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "recovery: materialize Alpha 12 Android source"
          git push origin HEAD:restore/materialize-alpha12-fast
