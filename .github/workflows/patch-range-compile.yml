name: One-shot Range compile patch

on:
  push:
    branches:
      - fix/restore-direct-source-build

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-direct-source-build
          fetch-depth: 0
      - name: Apply exact Java exception patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/io/github/zhanfg/sda/ModuleMain.java')
          text = path.read_text(encoding='utf-8')
          old = '''                    if (error instanceof CancellationException || closed.get()) throw error;'''
          new = '''                    if (error instanceof CancellationException || closed.get()) {
                        if (error instanceof Exception) throw (Exception) error;
                        if (error instanceof Error) throw (Error) error;
                        throw new IOException("Range session cancelled", error);
                    }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one cancellation throw, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/patch-range-compile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/io/github/zhanfg/sda/ModuleMain.java .github/workflows/patch-range-compile.yml
          git commit -m 'fix: normalize Range worker cancellation exceptions'
          git push origin HEAD:fix/restore-direct-source-build
