name: Patch Alpha15 validator strength

on:
  push:
    branches:
      - feat/rebuild-download-engine

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rebuild-download-engine
          fetch-depth: 0

      - name: Patch Validator.from only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("app/src/main/java/io/github/zhanfg/sda/ModuleMain.java")
          text = path.read_text(encoding="utf-8")
          marker = 'return new Validator(etag, modified);'
          if marker not in text:
              raise SystemExit("expected legacy Validator.from body is absent")

          replacement = '''        static Validator from(HttpURLConnection connection) {
              String etag = trim(connection.getHeaderField("ETag"));
              if (etag != null && etag.regionMatches(true, 0, "W/", 0, 2)) etag = null;
              if (etag != null) return new Validator(etag, null);

              String modified = trim(connection.getHeaderField("Last-Modified"));
              if (modified == null) return new Validator(null, null);

              long modifiedMillis;
              long responseDateMillis;
              try {
                  modifiedMillis = connection.getHeaderFieldDate("Last-Modified", -1L);
                  responseDateMillis = connection.getHeaderFieldDate("Date", -1L);
              } catch (Throwable ignored) {
                  return new Validator(null, null);
              }
              if (!RangeProtocol.isStrongLastModified(modifiedMillis, responseDateMillis)) {
                  return new Validator(null, null);
              }
              return new Validator(null, modified);
          }'''

          pattern = re.compile(
              r'        static Validator from\(HttpURLConnection connection\) \{.*?\n        \}(?=\n\n        boolean stable\(\))',
              re.DOTALL,
          )
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"expected exactly one Validator.from block, got {count}")
          path.write_text(updated, encoding="utf-8")

      - name: Verify focused diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          [ "$changed" = 'app/src/main/java/io/github/zhanfg/sda/ModuleMain.java' ]
          git diff -- app/src/main/java/io/github/zhanfg/sda/ModuleMain.java
          grep -Fq 'RangeProtocol.isStrongLastModified(modifiedMillis, responseDateMillis)' \
            app/src/main/java/io/github/zhanfg/sda/ModuleMain.java
          ! grep -Fq 'return new Validator(etag, modified);' \
            app/src/main/java/io/github/zhanfg/sda/ModuleMain.java

      - name: Commit focused runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/zhanfg/sda/ModuleMain.java
          git commit -m "fix: require strong Last-Modified in Range runtime"
          git push origin HEAD:feat/rebuild-download-engine
